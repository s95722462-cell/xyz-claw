<script>
/*CORE*/

// ───────── 게임 값 ─────────
const RAIL = 128;                         // 레일 높이 (바닥에서 mm)
const tipH = z => 62 - z;                 // Z(아래 +) → 집게 발끝 높이
const PRONG = 32;                         // 몸통 중심 ~ 발끝 (집게 1.3배)
const CHUTE = { x0: 0, y0: 0, x1: 34, y1: 34 };
let items = [], claw = { open: 1, target: 1, held: null, str: 1 }, credits = 3, wins = 0, got = [], phase = 'boot', timeLeft = 20, slipT = 0, slip2 = false, toastT = 0, lastBeep = 99;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

// 종류: 이름, 반지름, 잡힘(grip), 바닥 반높이 비율
const KIND = {
  bear:   { name: '곰돌이', r: 11.5, grip: 0.95, half: 0.95, w: 5 },
  bunny:  { name: '토끼', r: 10, grip: 0.85, half: 0.9, w: 3 },
  chick:  { name: '병아리', r: 9, grip: 0.8, half: 0.9, w: 3 },
  cat:    { name: '고양이', r: 10, grip: 0.85, half: 0.9, w: 3 },
  duck:   { name: '고무 오리', r: 9, grip: 0.7, half: 0.75, w: 3 },
  robot:  { name: '로봇', r: 10, grip: 0.6, half: 1.0, w: 2 },
  ball:   { name: '비치볼', r: 9, grip: 0.38, half: 1.0, w: 2 },
  gift:   { name: '선물 상자', r: 9, grip: 0.5, half: 0.8, w: 2 },
  dice:   { name: '주사위', r: 7.5, grip: 0.55, half: 0.75, w: 2 },
};
const BAG = Object.entries(KIND).flatMap(([k, v]) => Array(v.w).fill(k));
const LINES = {
  air: ['허공을 잡았네~', '어? 아무것도 없잖아!', '바람만 잡았다!', '헛손질~!'],
  graze: ['아! 아깝다~', '스쳤다 스쳤어!', '조금만 더 왼쪽이었는데!', '으아 아까워!'],
  hold: ['잡았다!', '올라간다~', '제발 제발…', '오오 간다 간다!'],
  slip: ['어어어?! 놓쳤다!', '앗, 미끄러졌다~', '안 돼애~', '아 진짜 아깝다!'],
  win: n => [`대박! ${n} 획득!`, `와! ${n} 뽑았다!`, `오예~ ${n}!`, `성공! ${n} 내 거!`],
  fail: ['다음엔 꼭!', '한 판 더?', '괜찮아, 다시!'],
  coin: ['띠링~ 한 판 추가!', '동전 들어간다~'],
  time: ['시간 끝! 그냥 간다~'],
};
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('show'); toastT = 2.2; }
function say(t, alsoToast = true) { if (alsoToast) toast(t); voice(t); }

// ───────── 소리 (장난감 느낌, 첫 클릭 뒤 시작) ─────────
const SND = { ac: null, on: true, music: true, voice: true, master: null, mus: null, mot: {} };
function audioInit() {
  if (SND.ac) { if (SND.ac.state === 'suspended') SND.ac.resume(); return; }
  try { SND.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return; }
  const ac = SND.ac;
  SND.master = ac.createGain(); SND.master.gain.value = SND.on ? 0.8 : 0; SND.master.connect(ac.destination);
  SND.mus = ac.createGain(); SND.mus.gain.value = SND.music ? 0.5 : 0; SND.mus.connect(SND.master);
  const noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1; SND.noise = noise;
  // 축마다 장난감 모터: 삼각파 + 떨림(LFO)
  const motor = (name, f) => {
    const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const lfo = ac.createOscillator(); lfo.frequency.value = 9; const lg = ac.createGain(); lg.gain.value = f * 0.06; lfo.connect(lg).connect(o.frequency);
    const g = ac.createGain(); g.gain.value = 0; o.connect(g).connect(SND.master); o.start(); lfo.start();
    SND.mot[name] = { o, g, f, acc: 0 };
  };
  motor('x', 330); motor('y', 392); motor('z', 494);
  startMusic();
}
function motorSet(name, speed, dt, up) {
  const m = SND.mot[name]; if (!m) return; const t = SND.ac.currentTime, k = Math.min(1, Math.abs(speed) / 70);
  m.o.frequency.setTargetAtTime(m.f * (0.85 + 0.45 * k) * (up === true ? 1.25 : up === false ? 0.85 : 1), t, 0.06);
  m.g.gain.setTargetAtTime(k > 0.03 ? 0.025 + 0.05 * k : 0, t, 0.05);
  m.acc += Math.abs(speed) * dt;                         // 2mm 마다 째깍
  if (k > 0.03 && m.acc > 2.2) { m.acc = 0; tone(m.f * 4, 0, 0.018, 'square', 0.035); }
}
function tone(f, t0, dur, type = 'square', vol = 0.15, f2, dest) {
  if (!SND.ac) return; const ac = SND.ac, t = ac.currentTime + t0;
  const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(dest || SND.master); o.start(t); o.stop(t + dur + 0.05);
}
function boing(f = 520, dur = 0.35, vol = 0.14) {
  if (!SND.ac) return; const ac = SND.ac, t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(f * 1.6, t); o.frequency.exponentialRampToValueAtTime(f * 0.6, t + dur);
  const l = ac.createOscillator(); l.frequency.value = 22; const lg = ac.createGain(); lg.gain.value = f * 0.12; l.connect(lg).connect(o.frequency);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(SND.master); o.start(t); l.start(t); o.stop(t + dur + 0.05); l.stop(t + dur + 0.05);
}
const sfx = {
  coin: () => { tone(1568, 0, 0.08, 'square', 0.1); tone(2093, 0.07, 0.3, 'square', 0.1); },
  click: () => tone(880, 0, 0.05, 'square', 0.08),
  start: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.06, 0.1, 'square', 0.09)),
  clamp: () => { boing(640, 0.28, 0.16); tone(180, 0, 0.08, 'square', 0.06, 120); },
  open: () => boing(420, 0.25, 0.12),
  win: () => { [523, 659, 784, 1047, 0, 1047, 1319, 1568].forEach((f, i) => f && tone(f, i * 0.09, 0.2, 'square', 0.1)); [262, 330, 392].forEach((f, i) => tone(f, i * 0.27, 0.3, 'triangle', 0.12)); },
  fail: () => { tone(392, 0, 0.3, 'square', 0.08, 370); tone(330, 0.25, 0.3, 'square', 0.08, 311); tone(262, 0.5, 0.7, 'square', 0.08, 196); },
  slip: () => { tone(1400, 0, 0.6, 'sine', 0.12, 300); },
  thud: () => { tone(160, 0, 0.12, 'sine', 0.2, 80); },
  beep: () => tone(1320, 0, 0.09, 'square', 0.09),
};
// 배경 음악: 8비트 루프 (C 장조 펜타토닉)
const MEL = [72, 76, 79, 76, 81, 79, 76, 74, 72, 74, 76, 79, 76, 74, 72, 0, 74, 77, 81, 77, 79, 76, 72, 74, 76, 79, 81, 84, 81, 79, 76, 0];
const BAS = [48, 0, 55, 0, 57, 0, 55, 0, 53, 0, 55, 0, 48, 0, 43, 0];
let musT = 0, musI = 0;
function startMusic() {
  setInterval(() => {
    if (!SND.ac || !SND.music) return;
    const ac = SND.ac, beat = 60 / 150 / 2;
    if (musT < ac.currentTime) musT = ac.currentTime + 0.05;
    while (musT < ac.currentTime + 0.2) {
      const n = MEL[musI % MEL.length], b = BAS[musI % BAS.length], t0 = musT - ac.currentTime;
      if (n) tone(440 * Math.pow(2, (n - 69) / 12), t0, beat * 0.9, 'square', 0.05, null, SND.mus);
      if (b) tone(440 * Math.pow(2, (b - 69) / 12), t0, beat * 1.6, 'triangle', 0.09, null, SND.mus);
      musI++; musT += beat;
    }
  }, 60);
}
// 목소리: 브라우저 음성(한국어, 높은 톤)
let koVoice = null;
function voice(t) {
  if (!SND.on || !SND.voice || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(t.replace(/~/g, '').replace(/…/g, ''));
    u.lang = 'ko-KR'; u.pitch = 1.8; u.rate = 1.12; u.volume = 0.9;

// 진자 흔들림 (래더 축 가속도로)
const sway = { ax: 0, vx: 0, az: 0, vz: 0, px: 0, py: 0, vpx: 0, vpy: 0 };
