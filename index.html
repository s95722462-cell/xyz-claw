<style>

:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1016; --panel:#24161e; --panel2:#2d1c26; --ink:#f7e8ee; --muted:#bfa3b0; --line:#43293a;
  --cab:#ff5c93; --cab2:#c23a6c; --accent:#ffc533; --go:#33d07f; --bad:#ff6b5e; --off:#4a3240; --stage:#120a10; color-scheme:dark}}
:root[data-theme="dark"]{

*{box-sizing:border-box}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}

.ctrl{display:grid;gap:12px;align-content:start}

.score b{display:block;font:600 24px var(--f-num);font-variant-numeric:tabular-nums}
.score span{font-size:11px;color:var(--muted)}

.dir{border:0;border-radius:50%;background:var(--panel2);color:var(--ink);font-size:22px;cursor:pointer;user-select:none;touch-action:none;box-shadow:inset 0 -4px 0 var(--line)}

.hint{font-size:12px;color:var(--muted);text-align:center;min-height:18px}
.timer{height:8px;border-radius:4px;background:var(--off);overflow:hidden}
.timer i{display:block;height:100%;background:var(--go);width:100%}
.timer i.hurry{background:var(--bad)}
.gotlist{font-size:12px;color:var(--muted);text-align:center;min-height:18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.lamp.on::before{background:var(--go)} .lamp.red.on::before{background:var(--bad)} .lamp.amb.on::before{background:var(--accent)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini button{font:12px var(--f-ui);border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:6px;padding:5px 9px;cursor:pointer}

.steps{font:12px var(--f-num);color:var(--muted);margin-top:6px}
details summary{cursor:pointer;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 6px}
.tabs button{font:12px var(--f-num);border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:5px;padding:3px 8px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--cab);color:#fff;border-color:var(--cab)}
.il{font:12px/1.5 var(--f-num);max-height:320px;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;white-space:pre}
.il .c{color:var(--muted)} .il .on{color:var(--go);font-weight:600} .il .op{color:var(--cab)}
.note{font-size:12px;color:var(--muted);max-width:75ch}
.err3d{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:14px;text-align:center;padding:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const sway = { ax: 0, vx: 0, az: 0, vz: 0, px: 0, py: 0, vpx: 0, vpy: 0 };
function swayStep(dt, L) {
  const x = AX[0].pos, y = AX[1].pos;
  const vx = (x - sway.px) / dt, vy = (y - sway.py) / dt; sway.px = x; sway.py = y;
  const accx = (vx - sway.vpx) / dt, accy = (vy - sway.vpy) / dt; sway.vpx = vx; sway.vpy = vy;
  const Lc = Math.max(25, L), w2 = 9810 / Lc, c = 3.2, cl = a => Math.max(-3000, Math.min(3000, a));
  sway.vx += (-w2 * sway.ax - c * sway.vx - cl(accx) / Lc) * dt; sway.ax += sway.vx * dt;
  sway.vz += (-w2 * sway.az - c * sway.vz - cl(accy) / Lc) * dt; sway.az += sway.vz * dt;
  sway.ax = Math.max(-0.35, Math.min(0.35, sway.ax)); sway.az = Math.max(-0.35, Math.min(0.35, sway.az));
  return [vx, vy];
}

// ───────── 상품 배치·쌓임 ─────────
const COLS = { bear: [0xb07a4a, 0x8a5a36, 0xf2e6d8, 0xffb6c8], bunny: [0xffffff, 0xffc9da, 0xd8c8ff], chick: [0xffe066], cat: [0xffb37a, 0xd9d9d9, 0x8ecbff], robot: [0x9fb8d6, 0xffa94d, 0x8ee0b0], gift: [0x4d8dff, 0xff4d8d, 0x7a4dff], ball: [0xffffff], duck: [0xffd21f], dice: [0xffffff] };
function newItem(kind, x, y) {
  const K = KIND[kind], s = rnd(0.9, 1.1);
  const d = { kind, name: K.name, r: K.r * s, grip: K.grip, half: K.half * K.r * s, x, y, h: 0, vh: 0, yaw: rnd(-0.6, 0.6), tx: rnd(-0.15, 0.15), tz: rnd(-0.15, 0.15), col: pick(COLS[kind]) };
  if (kind === 'ball' || kind === 'dice') { d.yaw = rnd(0, 6.3); d.tx = rnd(0, 6.3); d.tz = rnd(0, 6.3); }
  return d;
}
function restOf(d) {
  let rest = d.half;
  for (const o of items) {
    if (o === d || o === claw.held || o.inChute) continue;
    const dist = Math.hypot(o.x - d.x, o.y - d.y);
    if (dist < (o.r + d.r) * 0.72 && o.h < d.h - 0.5) rest = Math.max(rest, o.h + o.half * 0.8 + d.half * 0.75);
  }
  return rest;
}
function refill() {
  items.forEach(d => R3 && R3.scene.remove(d.g));
  items = []; let tries = 0;
  while (items.length < 15 && tries++ < 900) {
    const d = newItem(pick(BAG), rnd(46, 212), rnd(18, 152));
    if (items.every(o => Math.hypot(o.x - d.x, o.y - d.y) > (o.r + d.r) * 0.92)) { d.h = d.half; items.push(d); }
  }
  for (let i = 0; i < 7; i++) {          // 위층: 아래 인형 사이에 걸쳐 놓기
    const a = pick(items.filter(o => o.h < o.half + 1)), b2 = newItem(pick(BAG), a.x + rnd(-5, 5), a.y + rnd(-5, 5));
    b2.x = Math.max(44, Math.min(214, b2.x)); b2.y = Math.max(16, Math.min(154, b2.y)); b2.h = 60; items.push(b2);
  }
  for (let k = 0; k < 400; k++) items.forEach(d => { const r = restOf(d); if (d.h > r) d.h = Math.max(r, d.h - 1); });
  items.forEach(d => { d.h = restOf(d); if (R3) d.g = R3.makeItem(d); });
}

// ───────── 래더 실행 + 게임 ─────────
const DT = 0.004; let scans = 0, last = performance.now();
setB('X0', 1); setB('X1', 1);
const PULSES = new Map();   // 장치 → 끝나는 스캔 번호 (느린 PC 에서도 래더가 꼭 보도록)
function step() { for (const p of PROGRAMS) runProg(p, DT); firstScan = false; qd75(DT); scans++; for (const [d, end] of PULSES) if (scans >= end) { setB(d, 0); PULSES.delete(d); } }
function pulse(dev, ms = 150) { setB(dev, 1); PULSES.set(dev, scans + Math.max(12, Math.round(ms / 4))); }
function grabDepth(x, y) {     // 쌓인 높이까지만 내려감 (진짜 기계처럼 닿으면 멈춤)
  let top = 0;
  items.forEach(d => { if (d.inChute || d === claw.held) return; if (Math.hypot(d.x - x, d.y - y) < d.r * 0.9 + 3) top = Math.max(top, d.h + d.half * 0.15); });
  const tip = Math.max(5, top - 3);
  return Math.max(5, Math.min(57, 62 - tip));
}
function setPoints() {
  const x = AX[0].pos, y = AX[1].pos;
  const P2 = [[x, y, grabDepth(x, y)], [17, 17, 5]];
  P2.forEach((p, k) => p.forEach((v, j) => sD(3500 + 6 * k + 2 * j, v)));
  D[3150] = 2; D[3161] = 1; D[3158] = 6; sD(3550, 10); D[3552] = 4000; D[3554] = 2400;
}
function startGrab(auto) {
  if (phase !== 'aim') return;
  phase = 'run'; credits = Math.max(0, credits - 1); claw.str = rnd(0.72, 1.12); claw.won = false; slip2 = false;
  setPoints(); setB('M3016', 1); sfx.start(); pressT = 0.25;
  ['M3020', 'M3021', 'M3022', 'M3023'].forEach(d => setB(d, 0));
  if (auto) say(pick(LINES.time));
  pulse('M3012');
}
let prevStep = 0, prevRun = 0, pressT = 0;
function game(dt) {
  const sa = D[3170], pt = D[3160], run = getB('M3060');
  if (sa === 40 && prevStep !== 40) {
    if (pt === 1) { claw.target = 0; sfx.clamp(); setTimeout(tryGrab, 280); }
    if (pt === 2) { claw.target = 1; sfx.open(); release(); }
  }
  if (sa === 50 && claw.held && !claw.slipChecked) { claw.slipChecked = true; slipT = rnd(0.25, 0.75); }
  if (sa === 21 && claw.held && !slip2 && pt === 2) { slip2 = true; if (Math.random() < claw.held.slip * 0.35) slipT = rnd(0.2, 0.9); }
  if (slipT > 0) { slipT -= dt; if (slipT <= 0 && claw.held && Math.random() < claw.held.slip + 0.25) { release(); say(pick(LINES.slip)); sfx.slip(); } }
  if (prevRun && !run && phase === 'run') {
    setB('M3016', 0); phase = credits > 0 ? 'aim' : 'idle'; timeLeft = 20; lastBeep = 99; claw.target = 1;
    if (claw.held) release();
    if (!claw.won) { sfx.fail(); if (toastT <= 0) say(pick(LINES.fail)); }
  }
  prevStep = sa; prevRun = run;
  claw.open += Math.sign(claw.target - claw.open) * Math.min(Math.abs(claw.target - claw.open), dt * 3.5);
  // 떨어짐·쌓임
  items.forEach(d => {
    if (d === claw.held) return;
    const inC = d.x > CHUTE.x0 + 3 && d.x < CHUTE.x1 - 3 && d.y > CHUTE.y0 + 3 && d.y < CHUTE.y1 - 3;
    const rest = d.inChute ? -999 : restOf(d);
    if (d.h > rest + 0.05) { d.vh -= 900 * dt; d.h += d.vh * dt; d.falling = true; if (d.spin) { d.tx += d.spin * dt; } }
    if (!d.inChute && d.h <= rest) {
      if (inC && rest <= d.half + 0.1) { d.inChute = true; wins++; got.push(d.name); claw.won = true; say(pick(LINES.win(d.name))); sfx.win(); }
      else { if (d.falling && d.vh < -90) sfx.thud(); d.h = rest; d.vh = 0; d.falling = false; d.spin = 0; }
    }
  });
  items = items.filter(d => { if (d.inChute && d.h < -70) { R3 && R3.scene.remove(d.g); return false; } return true; });
  if (phase === 'aim') {
    timeLeft -= dt;
    const s = Math.ceil(timeLeft); if (s <= 5 && s !== lastBeep && s > 0) { lastBeep = s; sfx.beep(); }
    if (timeLeft <= 0) { timeLeft = 0; startGrab(true); }
  }
  if (pressT > 0) pressT -= dt;
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) document.getElementById('toast').classList.remove('show'); }
}
function tryGrab() {
  const x = AX[0].pos, y = AX[1].pos, th = tipH(AX[2].pos);
  let best = null, bd = 1e9;
  items.forEach(d => {                          // 집게 높이 안에 있는 것 중 가장 위
    if (d.inChute || d.falling) return; const dd = Math.hypot(d.x - x, d.y - y);
    if (dd > d.r + 3) return; if (d.h - d.half > th + 18 || d.h + d.half < th - 2) return;
    if (!best || d.h > best.h + 2 || (Math.abs(d.h - best.h) <= 2 && dd < bd)) { best = d; bd = dd; }
  });
  if (!best) { say(pick(LINES.air)); return; }
  const center = Math.max(0, 1 - bd / (best.r + 3));
  const chance = (0.15 + 0.85 * center) * best.grip * claw.str + 0.08;
  if (Math.random() < chance) { claw.held = best; claw.slipChecked = false; best.slip = Math.min(0.55, (1 - best.grip) * 0.6 + bd * 0.03 + (1.1 - claw.str) * 0.3); say(pick(LINES.hold), false); toast(pick(LINES.hold)); }
  else { best.x += (best.x - x) * 0.45 + rnd(-2, 2); best.y += (best.y - y) * 0.45 + rnd(-2, 2); best.x = Math.max(36, Math.min(218, best.x)); best.y = Math.max(14, Math.min(156, best.y)); best.yaw += rnd(-0.8, 0.8); say(pick(LINES.graze)); }
}
function release() { const d = claw.held; claw.held = null; if (d) { d.vh = 0; d.falling = true; d.spin = rnd(-2, 2); } }

// ───────── 그리기 ─────────
let lastZ = 0, blinkT = 0;
function render(dt) {
  if (!R3) return;
  const { T, cam, target, orbit, bridge, trolley, pend, cable, clawG, prongs, aim, bulbs, shaft, btn } = R3;
  const x = AX[0].pos, y = AX[1].pos, z = AX[2].pos;
  bridge.position.z = y; trolley.position.x = x;
  const hubY = tipH(z) + PRONG, L = (RAIL - 14) - (hubY + 17);
  const [vx, vy] = swayStep(Math.max(dt, 1e-3), L);
  pend.rotation.z = -sway.ax; pend.rotation.x = sway.az;
  cable.scale.y = Math.max(1, L); cable.position.y = -L / 2; clawG.position.y = -L - 17;
  const o = claw.open;
  prongs.forEach(p => { p.hinge.rotation.z = 0.12 + o * 0.5; p.knee.rotation.z = -0.15 - o * 0.25; });
  aim.position.set(x, 0.5, y); aim.visible = phase === 'aim';
  // 조작대: 조이스틱 기울기, 버튼 눌림
  const jx = getB('M3020') - getB('M3021'), jy = getB('M3022') - getB('M3023');
  shaft.rotation.z += (-jx * 0.4 - shaft.rotation.z) * Math.min(1, dt * 14); shaft.rotation.x += (jy * 0.4 - shaft.rotation.x) * Math.min(1, dt * 14);
  btn.position.y = pressT > 0 ? 1.2 : 2.5;
  R3.scene.updateMatrixWorld();
  items.forEach(d => {
    if (d === claw.held) { const v = new T.Vector3(0, -PRONG / 1.3 + 2 - d.half * 0.35, 0); clawG.localToWorld(v); d.g.position.copy(v); d.x = x; d.y = y; d.h = v.y; }
    else d.g.position.set(d.x, d.h, d.y);
    d.g.rotation.set(d.tx, d.yaw, d.tz);
  });
  blinkT += dt; bulbs.forEach((b, i) => b.material.emissiveIntensity = ((Math.floor(blinkT * (phase === 'run' ? 9 : 2.5)) + i) % 2) ? 1.6 : 0.2);
  cam.position.set(target.x + orbit.r * Math.sin(orbit.az) * Math.cos(orbit.el), target.y + orbit.r * Math.sin(orbit.el), target.z + orbit.r * Math.cos(orbit.az) * Math.cos(orbit.el));
  cam.lookAt(target);
  R3.renderer.render(R3.scene, cam);
  if (SND.ac && SND.on) { const vz = (z - lastZ) / Math.max(dt, 1e-3); motorSet('x', vx, dt); motorSet('y', vy, dt); motorSet('z', vz, dt, vz < -1 ? true : vz > 1 ? false : undefined); }
  lastZ = z;
}
function loop(now) {
  const el = Math.min(0.1, (now - last) / 1000); last = now;
  const n = Math.round(el / DT);
  try { for (let i = 0; i < n; i++) step(); } catch (e) { toast('래더 오류: ' + e.message); throw e; }
  guard(el); game(el); render(el); ui();
  requestAnimationFrame(loop);
}

// ───────── 화면 ─────────
const $ = id => document.getElementById(id);
const AUTO_T = { 0: '대기', 10: 'Z 올림', 11: 'Z 올림', 20: 'XY 이동', 21: 'XY 이동', 30: 'Z 내림', 31: 'Z 내림', 40: '머묾(집게)', 50: 'Z 올림', 51: 'Z 올림', 60: '다음 점' };
const fD = n => { fbuf.setInt16(0, D[n], true); fbuf.setInt16(2, D[n + 1], true); return fbuf.getFloat32(0, true); };
const sD = (n, x) => { fbuf.setFloat32(0, x, true); D[n] = fbuf.getInt16(0, true); D[n + 1] = fbuf.getInt16(2, true); };
const KEYMAP = { ArrowRight: 'M3020', ArrowLeft: 'M3021', ArrowDown: 'M3022', ArrowUp: 'M3023' };
const canMove = () => phase === 'aim';
document.querySelectorAll('.dir').forEach(b => {
  const d = b.dataset.mom;
  const on = e => { e.preventDefault(); if (!canMove()) return; setB(d, 1); b.classList.add('held'); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { setB(d, 0); b.classList.remove('held'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
});
addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { e.preventDefault(); if (canMove()) setB(KEYMAP[e.key], 1); }
  if (e.key === ' ' && (e.target === document.body || e.target.classList.contains('dir'))) { e.preventDefault(); startGrab(); }
});
addEventListener('keyup', e => { if (KEYMAP[e.key]) setB(KEYMAP[e.key], 0); });
$('coin').addEventListener('click', () => { credits++; sfx.coin(); say(pick(LINES.coin)); });
$('grab').addEventListener('click', () => startGrab(false));
$('refill').addEventListener('click', () => { sfx.click(); refill(); });
$('snd').addEventListener('click', e => { SND.on = !SND.on; e.currentTarget.setAttribute('aria-pressed', SND.on); if (SND.master) SND.master.gain.setTargetAtTime(SND.on ? 0.8 : 0, SND.ac.currentTime, 0.05); if (!SND.on && 'speechSynthesis' in window) speechSynthesis.cancel(); });
$('mus').addEventListener('click', e => { SND.music = !SND.music; e.currentTarget.setAttribute('aria-pressed', SND.music); if (SND.mus) SND.mus.gain.setTargetAtTime(SND.music ? 0.5 : 0, SND.ac.currentTime, 0.05); });
$('voc').addEventListener('click', e => { SND.voice = !SND.voice; e.currentTarget.setAttribute('aria-pressed', SND.voice); if (!SND.voice && 'speechSynthesis' in window) speechSynthesis.cancel(); });
// 휴대폰: 두 번 탭 확대·길게 눌러 메뉴 막기
addEventListener('dblclick', e => e.preventDefault(), { passive: false });
addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
document.querySelector('.panel').addEventListener('contextmenu', e => e.preventDefault());
// 게임 중 에러 없게: 끝 4mm 앞에서 JOG 끊기, 알람이 나면 스스로 리셋하고 필요하면 원점 복귀
const SOFT = [[3, 216], [3, 156]];
let healT = 0;
function guard(dt) {
  [['M3020', 0, 1], ['M3021', 0, -1], ['M3022', 1, 1], ['M3023', 1, -1]].forEach(([d, ax, dir]) => {
    if (!getB(d)) return; const p = AX[ax].pos; if ((dir > 0 && p >= SOFT[ax][1]) || (dir < 0 && p <= SOFT[ax][0])) setB(d, 0);
  });
  // 집게가 안전 높이(D3152)보다 아래에 남으면 래더 인터락(M3070)이 X·Y JOG 를 막음 → 조준 중이면 Z 를 자동으로 올림
  const zUp = phase === 'aim' && !getB('M3070') && !getB('M3060');
  if (zUp) { setB('M3025', 1); guard.z = true; } else if (guard.z) { setB('M3025', 0); guard.z = false; }
  healT -= dt;
  if (getB('M3075') && healT <= 0) { healT = 0.6; pulse('M3011', 200); if (phase === 'run') { setB('M3016', 0); phase = 'heal'; } }
  if (phase === 'heal' && !getB('M3075') && healT <= 0) { phase = 'homing'; pulse('M3014', 200); }
  if (phase !== 'homing' && phase !== 'boot' && phase !== 'heal' && !getB('M3040') && !getB('M3101') && !getB('M3075')) { setB('M3016', 0); phase = 'homing'; pulse('M3014', 200); }
}
function ui() {
  if (phase === 'homing' && getB('M3040') && !getB('M3101')) phase = credits > 0 ? 'aim' : 'idle';
  if (phase === 'idle' && credits > 0 && getB('M3040')) { phase = 'aim'; timeLeft = 20; }
  $('cr').textContent = credits; $('win').textContent = wins;
  $('tm').textContent = phase === 'aim' ? Math.ceil(timeLeft) : '-';
  $('tbar').style.width = (phase === 'aim' ? timeLeft / 20 * 100 : 0) + '%'; $('tbar').classList.toggle('hurry', phase === 'aim' && timeLeft <= 5);
  const gl = got.length ? '획득: ' + Object.entries(got.reduce((m, n) => (m[n] = (m[n] || 0) + 1, m), {})).map(([n, c]) => c > 1 ? `${n} ×${c}` : n).join(', ') : '아직 뽑은 게 없어요'; if ($('gotlist').textContent !== gl) $('gotlist').textContent = gl;
  $('grab').disabled = phase !== 'aim';
  $('hint').textContent = phase === 'homing' || phase === 'boot' || phase === 'heal' ? '집게가 원점(출구 위)으로 가는 중…' : phase === 'run' ? '집게가 뽑는 중! (래더 자동 운전)' : phase === 'idle' ? '동전을 넣으세요' : '조이스틱(방향키)으로 조준 → 뽑기(스페이스)';
  $('pos').textContent = `X ${AX[0].pos.toFixed(1)}  Y ${AX[1].pos.toFixed(1)}  Z ${AX[2].pos.toFixed(1)}`;
}
build3d(); refill();
setTimeout(() => { D[3164] = 1500; pulse('M3014', 200); phase = 'homing'; }, 400);
requestAnimationFrame(t => { last = t; loop(t); });
</script>
